# Lexoria — HTTPS configuration example (self-contained; swap in via
# NGINX_CONF=./infra/nginx/nginx.https.example.conf and restart web).
#
# Requires certificates in infra/nginx/certs (bind-mounted at /etc/nginx/certs):
#   server.crt  (cert, or full chain incl. intermediates)
#   server.key  (private key)
# Generate a throwaway self-signed pair for testing with:
#   openssl req -x509 -nodes -newkey rsa:2048 -keyout infra/nginx/certs/server.key \
#               -out infra/nginx/certs/server.crt -days 365 -subj "/CN=localhost"
# Then also set, in .env:  ALLOWED_ORIGINS=https://<your-domain>
#                          COOKIE_SECURE=true
#                          HTTP_PORT=80 HTTPS_PORT=443 (optional)
# and: docker compose up -d web

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    gzip              on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    limit_req_zone  $binary_remote_addr  zone=auth_login:10m  rate=10r/m;
    limit_req_status 429;

    upstream lexoria_api {
        server api:8000;
        keepalive 32;
    }

    # --- plain HTTP -> redirect to HTTPS -----------------------------------
    server {
        listen       80;
        listen       [::]:80;
        server_name  _;
        return 301 https://$host$request_uri;
    }

    # --- HTTPS server -------------------------------------------------------
    server {
        listen       443 ssl;
        listen       [::]:443 ssl;
        http2       on;
        server_name  _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        root  /usr/share/nginx/html;
        client_max_body_size 10m;

        proxy_http_version 1.1;
        proxy_set_header Connection              "";
        proxy_set_header Host                    $host;
        proxy_set_header X-Real-IP               $remote_addr;
        proxy_set_header X-Forwarded-For         $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto       $scheme;
        proxy_set_header X-Forwarded-Host        $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout   300s;
        proxy_read_timeout   300s;

        location = /health {
            proxy_pass http://lexoria_api/health;
        }

        location /api/v1/ {
            proxy_pass http://lexoria_api;
        }

        location ~ ^/api/v1/auth/login$ {
            limit_req zone=auth_login burst=5 nodelay;
            proxy_pass http://lexoria_api;
        }

        location /assets/ {
            try_files $uri =404;
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location / {
            try_files $uri $uri/ /index.html;

            add_header Cache-Control "no-cache" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        }
    }
}
