# Lexoria — web: SPA static serving + reverse proxy for the API.
#
# Bind-mounted read-only by docker compose into the `web` container at
# /etc/nginx/nginx.conf (replaces the image default). This file is plain HTTP;
# for HTTPS use infra/nginx/nginx.https.example.conf via NGINX_CONF together
# with certs in infra/nginx/certs (see README "HTTPS").

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    # gzip for static assets
    gzip              on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # ---- Auth login rate limiting (nginx in-memory; no Redis) ----
    # Tune rate/burst to your traffic; responses are 429 (limit_req_status).
    limit_req_zone  $binary_remote_addr  zone=auth_login:10m  rate=10r/m;
    limit_req_status 429;

    # API upstream = compose service `api` (uvicorn :8000). Resolved at nginx
    # startup; the `web` service only starts after `api` is healthy
    # (depends_on condition), so the name is always resolvable.
    upstream lexoria_api {
        server api:8000;
        keepalive 32;
    }

    server {
        listen       80;
        listen       [::]:80;
        server_name  _;

        root  /usr/share/nginx/html;
        client_max_body_size 10m;

        # Forwarded headers inherited by every proxy location below
        # (a location that defines none keeps these).
        proxy_http_version 1.1;
        proxy_set_header Connection              "";
        proxy_set_header Host                    $host;
        proxy_set_header X-Real-IP               $remote_addr;
        proxy_set_header X-Forwarded-For         $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto       $scheme;
        proxy_set_header X-Forwarded-Host        $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout   300s;   # PDF generation can be slow
        proxy_read_timeout   300s;

        # API health endpoint (also used by the container healthcheck)
        location = /health {
            proxy_pass http://lexoria_api/health;
        }

        # API backend — prefix preserved: /api/v1/* -> /api/v1/*
        location /api/v1/ {
            proxy_pass http://lexoria_api;
        }

        # Auth login brute-force protection.
        # Regex location wins over the /api/v1/ prefix above.
        # Adjust the path if the real login route differs.
        location ~ ^/api/v1/auth/login$ {
            limit_req zone=auth_login burst=5 nodelay;
            proxy_pass http://lexoria_api;
        }

        # Hashed (immutable) build assets — Vite default output under /assets/
        location /assets/ {
            try_files $uri =404;
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # Built SPA with history-routing fallback + security headers
        location / {
            try_files $uri $uri/ /index.html;

            # SPA shell is revalidated on every load so deploys propagate
            add_header Cache-Control "no-cache" always;
            # security headers
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        }
    }
}
